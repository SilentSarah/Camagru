server {
    listen 3001;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for JavaScript files
    location ~* \.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Serve uploaded images directly from shared volume
    location /uploads/ {
        alias /var/www/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy all /api/* requests to PHP-FPM backend
    location /api/ {
        include fastcgi_params;
        fastcgi_pass camagru_backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/src/backend/index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        
        # Increase timeouts for image processing
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        
        # Increase buffer sizes for large image uploads
        client_max_body_size 20M;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
