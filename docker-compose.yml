services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb_container
    environment:
      MYSQL_ROOT_PASSWORD: ROOT
      MYSQL_DATABASE: CAMAGRU
      MYSQL_USER: ROOT
      MYSQL_PASSWORD: ROOT
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
  adminer:
    image: adminer:latest
    container_name: adminer_container
    ports:
      - "8080:8080"
    networks:
      - backend
  nginx-php:
    image: trafex/php-nginx:latest
    container_name: nginx_php_container
    ports:
      - "80:8001"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mariadb
    networks:
      - backend

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: ./db_data
      o: bind
  mail:
    driver: local
    driver_opts:
      type: none
      device: ./mail
      o: bind

networks:
  backend:
    driver: bridge